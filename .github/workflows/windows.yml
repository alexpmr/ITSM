name: CI e build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes de regras (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências de testes
        run: python -m pip install pytest
      - name: Verificar sintaxe
        run: python -m compileall -q src main.py
      - name: Executar testes
        run: python -m pytest -q

  windows:
    name: Gerar executável Windows x64
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Executar testes
        run: python -m pytest -q
      - name: Gerar EXE portátil
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PT2VHF-ITSM --paths src main.py
      - name: Publicar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-ITSM-Windows-x64
          path: dist/PT2VHF-ITSM.exe
          if-no-files-found: error
          retention-days: 30
