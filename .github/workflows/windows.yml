name: CI, Windows e distribuição

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes de regras (Linux)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Obter versão do código
        id: version
        shell: bash
        run: |
          VERSION="$(python -c "import sys;sys.path.insert(0,'src');import itsm;print(itsm.__version__)")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versão inválida: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Instalar pytest
        run: python -m pip install pytest
      - name: Verificar sintaxe
        run: python -m compileall -q src main.py
      - name: Executar testes
        run: python -m pytest -q

  windows:
    name: Gerar instalador e portátil Windows x64
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Executar testes
        run: python -m pytest -q
      - name: Gerar EXE portátil
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PT2VHF-ITSM --paths src main.py
          if ($LASTEXITCODE -ne 0) { throw "Falha no empacotamento" }
      - name: Gerar instalador Inno Setup
        shell: pwsh
        env:
          ITSM_VERSION: ${{ needs.tests.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar Inno Setup" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe não encontrado" }
          & $iscc "/DMyAppVersion=$env:ITSM_VERSION" "scripts\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar Setup" }
      - name: Preparar pacotes
        shell: pwsh
        run: |
          Copy-Item "dist\PT2VHF-ITSM.exe" "dist\PT2VHF-ITSM-Windows-x64-Portable.exe"
          if (-not (Test-Path "dist\PT2VHF-ITSM-Windows-x64-Setup.exe")) { throw "Setup ausente" }
      - name: Publicar artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-ITSM-Windows-x64
          path: |
            dist/PT2VHF-ITSM-Windows-x64-Setup.exe
            dist/PT2VHF-ITSM-Windows-x64-Portable.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release oficial e contadores
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [tests, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PT2VHF-ITSM-Windows-x64
          path: dist
      - name: Publicar versão permanente
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITSM_VERSION: ${{ needs.tests.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${ITSM_VERSION}"
          packages=(dist/PT2VHF-ITSM-Windows-x64-Setup.exe dist/PT2VHF-ITSM-Windows-x64-Portable.exe)
          for f in "${packages[@]}"; do test -s "$f"; done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag já existe; preservando assets e contagens."
            existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for f in "${packages[@]}"; do
              name="$(basename "$f")"
              if ! grep -Fxq "$name" <<< "$existing"; then
                gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$tag" "${packages[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "PT2VHF ITSM v${ITSM_VERSION} — MVP Windows x64" \
              --notes "Versão experimental Windows 10/11 x64, ainda em validação. Instalador por usuário e EXE portátil, não assinados. Módulos MVP: incidentes, requisições, mudanças, problemas, ITAM, SLAs e CMDB. Aplicativo local e monousuário, sem autenticação corporativa. Não utilize dados sensíveis." \
              --latest
          fi
      - name: Atualizar os indicadores de downloads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python scripts/refresh_download_badges.py
          git add badges
          if ! git diff --cached --quiet; then
            git commit -m "docs: atualiza contadores [skip ci]"
            git push origin HEAD:main
          fi
