name: Contadores cumulativos de download

on:
  schedule:
    - cron: "21 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar downloads reais nas Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_download_badges.py
      - name: Publicar badges atualizados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges
          if ! git diff --cached --quiet; then
            git commit -m "docs: atualiza contadores [skip ci]"
            git push origin HEAD:main
          fi
